name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 -cover ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: PID 1 and capability integration tests
        if: runner.os == 'Linux'
        run: |
          docker pull alpine:3.21
          GONNER_DOCKER_TESTS=1 go test -count=1 -timeout=10m ./internal/integration
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...
      - name: Build and scan all release targets
        run: bash scripts/check-artifacts.sh
